<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{Subject}}</title>
    <style>
        body { background-color: #f4f7fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin: 0; padding: 20px 0; color: #2d3748; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); overflow: hidden; border: 1px solid #e2e8f0; }
        .header { background-color: #1a3a5c; padding: 30px 20px; text-align: center; }
        .header.red { background-color: #e53e3e; }
        .header.green { background-color: #2f855a; }
        .header h1 { color: #ffffff; font-size: 22px; font-weight: 700; margin: 0; }
        .content { padding: 35px 30px 25px; }
        .greeting { font-size: 18px; color: #1a3a5c; font-weight: 600; margin-bottom: 16px; }
        .message { color: #4a5568; font-size: 15px; margin-bottom: 24px; }
        .info-box { background-color: #f8fafc; border-right: 4px solid #2a5f8f; border-radius: 6px; padding: 14px 18px; margin: 20px 0; font-size: 14px; color: #4a5568; }
        .info-box p { margin: 7px 0; }
        .footer { padding: 25px 30px; background: #f8fafc; border-top: 1px solid #e2e8f0; text-align: center; font-size: 13px; color: #718096; }
    </style>
</head>
<body>
    <table class="container" cellpadding="0" cellspacing="0" width="100%">        <tr><td class="header"><h1>📄 تحديث في سجلك الطبي</h1></td></tr>
        <tr><td class="content">
            <p class="greeting">مرحباً {{PatientName}}،</p>
            <p class="message">تم إضافة تحديث جديد على سجلك الطبي من قبل د. {{DoctorName}}.</p>                <div class="footer">
                    <p style="margin:0 0 10px; font-weight:700; color:#1a3a5c; font-size:14px;">{{ClinicName}}</p>
                    <p class="copyright">&copy; {{Year}} {{ClinicName}}. جميع الحقوق محفوظة.</p>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
